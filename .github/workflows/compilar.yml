name: Compilar APK

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 (Compatible con Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar dependencias de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Crear y sincronizar proyecto Android
        run: |
          npx cap init "Calcar AR" "com.peperey.calcar" --web-dir www
          npx cap add android
          python3 configurar_permisos.py
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Calcar-AR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
