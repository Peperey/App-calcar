name: Compilar APK

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar proyecto Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Calcar AR" "com.peperey.calcar" --web-dir www
          npx cap add android

          # Inyectar permisos de camara
          python3 -c "
path = 'android/app/src/main/AndroidManifest.xml'
with open(path, 'r') as f:
    c = f.read()
perms = '''
    <uses-permission android:name=\"android.permission.CAMERA\" />
    <uses-feature android:name=\"android.hardware.camera\" />
'''
c = c.replace('</manifest>', perms + '\n</manifest>')
with open(path, 'w') as f:
    f.write(c)
"
          npx cap sync android

      - name: Aceptar licencias y Compilar APK
        run: |
          cd android
          chmod +x ./gradlew
          # Compilar generando reporte de errores si algo falla
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Calcar-AR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
